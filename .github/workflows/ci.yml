name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Build runtime
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Build assembly audit tool
        run: dotnet build tools/SleddersAssemblyAudit/SleddersAssemblyAudit.csproj --configuration Release --nologo

      - name: Check Lua syntax
        run: dotnet run --project tools/LuaSyntaxCheck/LuaSyntaxCheck.csproj --configuration Release -- examples tests/manual

      - name: Build documentation site
        run: python tools/build_site.py --root . --output site-dist --repository "${{ github.repository }}"

      - name: Package dry run
        shell: pwsh
        run: ./scripts/package.ps1 -Version "ci"

