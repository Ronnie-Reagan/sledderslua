name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Validate tag and source version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must be SemVer-like, for example v0.4.0 or v0.4.0-rc.1. Got: $tag"
          }
          $version = $tag.Substring(1)
          $sourceVersion = (python tools/version.py get).Trim()
          if ($sourceVersion -ne $version) {
            throw "Tagged source version '$sourceVersion' does not match tag '$tag'. Commit the release version before tagging."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Check Lua syntax
        run: dotnet run --project tools/LuaSyntaxCheck/LuaSyntaxCheck.csproj --configuration Release -- examples tests/manual

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts/SleddersLuaRuntime-*.zip | Select-Object -First 1
          $sha = Get-ChildItem artifacts/SleddersLuaRuntime-*.zip.sha256 | Select-Object -First 1
          $args = @("release", "create", $env:GITHUB_REF_NAME, $zip.FullName, $sha.FullName, "--verify-tag", "--generate-notes", "--title", "Sledders Lua Runtime $env:GITHUB_REF_NAME")
          if ("${{ steps.version.outputs.prerelease }}" -eq "true") { $args += "--prerelease" } else { $args += "--latest" }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }
